<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feira da Quebrada</title>
    <meta
      name="description"
      content="Feira da Quebrada: descubra produtos, serviços e empreendedores locais em um catálogo digital que valoriza e fortalece o comércio da comunidade."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&family=Nunito:wght@200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="cabecalho">
      <div class="logo"><img src="assets/icons/logo.svg" alt="logo" /></div>
      <nav class="navegacao">
        <ul>
          <li><a href="#">Início</a></li>
          <li><a href="#">Catálogo</a></li>
          <li><a href="#">Cadastro</a></li>
          <li>
            <button
              type="button"
              class="btn-icone"
              aria-label="Carrinho de compras"
            >
              <img src="assets/icons/carrinho.svg" alt="" aria-hidden="true" />
            </button>
          </li>
          <li>
            <button type="button" class="btn-icone" aria-label="Pesquisar">
              <img src="assets/icons/lupa.svg" alt="" aria-hidden="true" />
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="introducao">
        <div class="introducao-imagem" aria-hidden="true"></div>
        <div class="introducao-conteudo">
          <h1>Feira da<br />Quebrada</h1>
          <h2>Vitrine para empreendedores locais</h2>
          <p>
            Aqui você encontra produtos e serviços de quem faz a nossa
            comunidade acontecer. Valorize o comércio local!
          </p>
          <a href="#" class="introducao-botao">
            <span>Ver catálogo</span>
            <img
              src="assets/icons/seta.svg"
              alt=""
              class="introducao-botao-icon"
              aria-hidden="true"
            />
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
